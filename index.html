<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Portfolio">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Portfolio</title>
<style>
:root{
  --bg:#f4f4f2; --card:#fcfcfb; --ink:#1c1c1a; --ink2:#5c5c57; --ink3:#8d8d86; --line:#e4e4df;
  --up:#e03131; --down:#1971c2; --accent:#2b3a55; --chip:#ecece8; --warn:#b35c00;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111110; --card:#1a1a19; --ink:#ededea; --ink2:#a9a9a2; --ink3:#77776f; --line:#2c2c2a;
    --up:#ef5350; --down:#3a8fe0; --accent:#c9d3e6; --chip:#262624; --warn:#e0a04a; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom)) 0;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header{display:flex;align-items:center;gap:10px;padding:14px 0 10px}
header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
header .at{flex:1;font-size:12px;color:var(--ink3);text-align:right}
.ib{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 10px;font-size:13px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card h2{font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 10px;letter-spacing:.01em}
.hero .big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.hero .sub{margin-top:4px;font-size:14px;color:var(--ink2)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--bg);border-radius:11px;padding:10px 12px}
.tile .l{font-size:12px;color:var(--ink3)}
.tile .v{font-size:17px;font-weight:650;margin-top:2px}
.tile .d{font-size:12px;color:var(--ink3);margin-top:1px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink2)}
.mk{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.mk > div{background:var(--bg);border-radius:10px;padding:8px 10px}
.mk .l{font-size:11.5px;color:var(--ink3)} .mk .v{font-size:14.5px;font-weight:600} .mk .c{font-size:12px}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:2px;margin-bottom:8px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;font-size:13px;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.ctop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nowv{font-weight:650;font-size:15px;margin-bottom:8px}
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;height:190px}
.tip{position:absolute;top:0;pointer-events:none;background:var(--ink);color:var(--card);border-radius:8px;padding:5px 9px;font-size:12px;white-space:nowrap;transform:translateX(-50%);display:none}
.tip b{font-size:13.5px}
.alloc .row{display:grid;grid-template-columns:minmax(96px,36%) 1fr 52px;align-items:center;gap:8px;margin:9px 0;font-size:13.5px}
.alloc .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alloc .sm{display:block;font-size:11.5px;color:var(--ink3)}
.alloc .bar{height:10px;background:var(--bg);border-radius:4px;overflow:hidden}
.alloc .bar i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0;opacity:.85}
.alloc .pc{text-align:right;color:var(--ink2)}
.sec{font-size:13px;font-weight:600;color:var(--ink2);margin:16px 2px 8px}
.stock{display:grid;grid-template-columns:1fr 78px auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.stock:first-child{border-top:0;padding-top:2px}
.stock .n{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stock .m{font-size:12px;color:var(--ink3);margin-top:1px}
.stock .r{text-align:right}
.stock .p{font-weight:600}
.stock .c{font-size:12.5px}
.stock svg{width:78px;height:30px;display:block}
.det{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 10px;margin:0 0 12px;padding:10px 12px;background:var(--bg);border-radius:11px}
.det div{min-width:0} .det dt{font-size:11.5px;color:var(--ink3)} .det dd{margin:1px 0 0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.det small{display:block;font-size:11px;color:var(--ink3);line-height:1.35}
.chipx{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;background:var(--chip);color:var(--ink2);margin-left:6px;vertical-align:1px}
.ev{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.ev:first-child{border-top:0;padding-top:2px}
.ev .d{font-size:12px;color:var(--ink2);text-align:center;background:var(--bg);border-radius:9px;padding:5px 0}
.ev .d b{display:block;font-size:14px;color:var(--ink)}
.ev .d.soon{outline:1.5px solid var(--warn)} .ev .d.soon b{color:var(--warn)}
.ev .t b{font-weight:600} .ev .t span{display:block;font-size:13px;color:var(--ink2)}
.feed a{display:block;padding:10px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.feed a:first-child{border-top:0;padding-top:2px}
.feed .h{font-size:12px;color:var(--ink3)} .feed .ti{font-size:14.5px;margin-top:1px}
.feed .imp{color:var(--warn);font-weight:600}
.lg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 8px;margin:2px 0 14px}
@media (min-width:480px){.lg{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (min-width:680px){.lg{grid-template-columns:repeat(6,minmax(0,1fr))}}
.lt{border:0;background:none;padding:0;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;font:inherit}
.lt .bx{position:relative;width:100%;max-width:84px;aspect-ratio:1}
.logo{width:100%;height:100%;border-radius:20%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.logo.tx{background:var(--chip);color:var(--ink2);font-weight:700;font-size:20px;letter-spacing:-.5px}
.lt .ct{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;line-height:20px;border-radius:10px;background:var(--accent);color:var(--card);font-size:11px;font-weight:700;text-align:center;padding:0 5px}
.lt .ct.imp{background:var(--warn)}
.lt .nm{font-size:11.5px;line-height:1.25;text-align:center;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:keep-all}
.lt .sb{font-size:10.5px;color:var(--ink3);margin-top:-3px}
.fh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.fh .logo{width:52px;height:52px;flex:none} .fh .logo.tx{font-size:16px}
.fh .t{flex:1;min-width:0} .fh .t b{display:block;font-size:17px} .fh .t span{font-size:12.5px;color:var(--ink3)}
.calh{display:flex;align-items:center;gap:6px;margin-bottom:10px} .calt{flex:1;font-size:17px;font-weight:700}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.calg .wd{text-align:center;font-size:12px;color:var(--ink3);padding:2px 0 6px}
.calg .sun{color:var(--up)} .calg .sat{color:var(--down)}
.day{border:0;background:var(--bg);border-radius:9px;min-height:66px;padding:5px 3px 4px;display:flex;flex-direction:column;align-items:stretch;gap:2px;cursor:pointer;overflow:hidden;color:var(--ink)}
.day .num{font-size:13px;font-weight:600;align-self:center;width:24px;height:24px;line-height:24px;border-radius:50%;text-align:center}
.day.sun .num{color:var(--up)} .day.sat .num{color:var(--down)}
.day.out{background:transparent} .day.out .num,.day.out .chip{opacity:.38}
.day.today .num{background:var(--accent);color:var(--card)}
.day.sel{outline:2px solid var(--accent);outline-offset:-2px}
.day .chip{display:block;font-size:10px;line-height:1.35;padding:1px 3px;border-radius:4px;background:var(--chip);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:clip;text-align:left}
.day .chip.soon{background:transparent;box-shadow:inset 0 0 0 1px var(--warn);color:var(--warn);font-weight:600}
.day .more{font-size:10px;color:var(--ink3);text-align:center}
.empty{color:var(--ink3);font-size:13.5px;padding:6px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{border:0;background:transparent;padding:11px 0 10px;font-size:13px;color:var(--ink3);cursor:pointer}
nav button.on{color:var(--ink);font-weight:700}
.page{display:none} .page.on{display:block}
#lock{max-width:340px;margin:22vh auto 0;padding:0 20px;text-align:center}
#lock h1{font-size:22px;margin:0 0 6px} #lock p{color:var(--ink2);font-size:13.5px;margin:0 0 18px}
#lock input{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
#lock button{width:100%;margin-top:10px;padding:12px;border-radius:11px;border:0;background:var(--accent);color:var(--card);font-weight:600;font-size:15px;cursor:pointer}
#lock .err{color:var(--up);font-size:13px;min-height:20px;margin-top:10px}
#lock label{display:flex;gap:6px;justify-content:center;align-items:center;font-size:13px;color:var(--ink2);margin-top:12px}
.dim{opacity:.55;transition:opacity .2s}
</style>
</head>
<body>
<div id="lock">
  <h1>Portfolio</h1>
  <p>비밀번호를 입력하면 이 기기에서 데이터를 풉니다.</p>
  <form id="lf"><input type="text" autocomplete="username" value="portfolio" hidden><input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호">
  <button type="submit">열기</button></form>
  <label><input id="keep" type="checkbox" checked> 이 기기에 기억하기</label>
  <div class="err" id="err" role="alert"></div>
</div>

<div id="app" hidden>
<div class="wrap">
  <header><h1>Portfolio</h1><div class="at" id="at"></div>
    <button class="ib" id="rf" aria-label="새로고침">새로고침</button><button class="ib" id="lk" aria-label="잠금">잠금</button></header>

  <section class="page on" id="p-sum"></section>
  <section class="page" id="p-stk"></section>
  <section class="page" id="p-cal"></section>
  <section class="page" id="p-feed"></section>
</div>
<nav><div class="in">
  <button class="on" data-p="sum">요약</button><button data-p="stk">종목</button><button data-p="cal">일정</button><button data-p="feed">소식</button>
</div></nav>
</div>

<script>
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const SVG = (tag, attrs) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const won = n => Math.round(n).toLocaleString("ko-KR");
const sgn = n => (n > 0 ? "+" : n < 0 ? "−" : "") + won(Math.abs(n));
const pct = (n, d=1) => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toFixed(d) + "%";
const arrow = n => n > 0 ? "▲" : n < 0 ? "▼" : "";
const cls = n => n > 0 ? "up" : n < 0 ? "down" : "flat";
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
                set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }, del(k){ try { localStorage.removeItem(k); } catch(e){} } };
let PW = null, DATA = null, HMODE = "ret", FMODE = "f", AMODE = "mkt";

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw) {
  const r = await fetch("data.enc.json?t=" + Date.now(), {cache: "no-store"});
  if (!r.ok) throw new Error("데이터 파일을 찾지 못했습니다. 아직 한 번도 생성되지 않았을 수 있습니다.");
  const j = await r.json();
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(j.s), iterations: j.it, hash: "SHA-256"}, km, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  let pt;
  try { pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(j.iv)}, key, b64(j.ct)); }
  catch (e) { const er = new Error("비밀번호가 맞지 않습니다."); er.bad = true; throw er; }
  return JSON.parse(new TextDecoder().decode(pt));
}

async function load(pw, quiet) {
  const app = $("#app");
  if (quiet) app.classList.add("dim");
  try {
    DATA = await decrypt(pw); PW = pw;
    $("#lock").hidden = true; app.hidden = false; render();
    return true;
  } catch (e) {
    if (!quiet || e.bad) { $("#app").hidden = true; $("#lock").hidden = false; $("#err").textContent = e.message; if (e.bad) store.del("pf_pw"); }
    return false;
  } finally { app.classList.remove("dim"); }
}

$("#lf").addEventListener("submit", async ev => {
  ev.preventDefault(); $("#err").textContent = "";
  const pw = $("#pw").value; if (!pw) return;
  if (await load(pw) && $("#keep").checked) store.set("pf_pw", pw);
  $("#pw").value = "";
});
$("#lk").addEventListener("click", () => { store.del("pf_pw"); PW = null; DATA = null; $("#app").hidden = true; $("#lock").hidden = false; });
$("#rf").addEventListener("click", () => PW && load(PW, true));
document.addEventListener("visibilitychange", () => { if (!document.hidden && PW) load(PW, true); });
setInterval(() => { if (!document.hidden && PW) load(PW, true); }, 5 * 60 * 1000);
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("on", p.id === "p-" + b.dataset.p));
  window.scrollTo(0, 0);
}));

function render() {
  $("#at").textContent = "기준 " + DATA.at;
  renderSum(); renderStocks(); renderCal(); renderFeed();
}

/* ---------- 요약 ---------- */
function renderSum() {
  const p = $("#p-sum"); p.textContent = "";
  const t = DATA.total;
  const hero = el("div", "card hero");
  if (t) {
    hero.append(el("h2", "", "전체 포트폴리오"), el("div", "big", won(t.val) + "원"));
    const sub = el("div", "sub"); sub.append("누적 손익 ");
    sub.append(el("b", cls(t.pnl), `${arrow(t.pnl)} ${sgn(t.pnl)}원 (${pct(t.ret)})`)); hero.append(sub);
    const tiles = el("div", "tiles");
    for (const [k, lab] of [["kr", "국내 최근 거래일"], ["us", "미국 최근 거래일"]]) {
      const m = t[k]; if (!m) continue;
      const ti = el("div", "tile"); ti.append(el("div", "l", lab));
      ti.append(el("div", "v " + cls(m.dpnl), `${arrow(m.dpnl)} ${sgn(m.dpnl)}원`));
      ti.append(el("div", "d", `${pct(m.dpct, 2)} · ${m.date.slice(5).replace("-", "/")}`)); tiles.append(ti);
    }
    hero.append(tiles);
  } else {
    hero.append(el("h2", "", "전체 포트폴리오"), el("div", "empty", "tickers.csv에 평단가와 수량을 입력하면 평가액과 손익이 표시됩니다."));
  }
  p.append(hero);

  if (DATA.hist && DATA.hist.length >= 2) {
    const c = el("div", "card"); c.append(el("h2", "", "추이"));
    const seg = el("div", "seg");
    for (const [k, lab] of [["ret", "누적 수익률"], ["val", "평가액"]]) {
      const b = el("button", HMODE === k ? "on" : "", lab); b.type = "button";
      b.addEventListener("click", () => { HMODE = k; renderSum(); }); seg.append(b);
    }
    const last = DATA.hist[DATA.hist.length - 1];
    const now = el("span", "nowv", HMODE === "val" ? won(last[1]) + "원" : pct(last[2] ? (last[1] / last[2] - 1) * 100 : 0, 2));
    const top = el("div", "ctop"); top.append(seg, now);
    c.append(top, histChart(DATA.hist, HMODE)); p.append(c);
  } else if (t) {
    const c = el("div", "card"); c.append(el("h2", "", "추이"), el("div", "empty", "기록이 이틀 이상 쌓이면 그래프가 표시됩니다.")); p.append(c);
  }

  const held = DATA.rows.filter(r => r.val != null);
  if (held.length) {
    const c = el("div", "card alloc"); c.append(el("h2", "", "비중"));
    const seg = el("div", "seg");
    for (const [k, lab] of [["mkt", "시장"], ["sec", "섹터"], ["stk", "종목"]]) {
      const b = el("button", AMODE === k ? "on" : "", lab); b.type = "button";
      b.addEventListener("click", () => { AMODE = k; renderSum(); }); seg.append(b);
    }
    c.append(seg);
    const keyOf = r => AMODE === "mkt" ? (r.us ? "미국" : "국내") : AMODE === "sec" ? (r.sector || "미분류") : r.name;
    const g = new Map();
    for (const r of held) { const k = keyOf(r), o = g.get(k) || {val: 0, pnl: 0, inv: 0}; o.val += r.val; o.pnl += r.pnl; o.inv += (r.inv || 0); g.set(k, o); }
    const tot = held.reduce((x, r) => x + r.val, 0);
    for (const [k, o] of [...g.entries()].sort((x, y) => y[1].val - x[1].val)) {
      const row = el("div", "row"), w = o.val / tot * 100;
      const bar = el("div", "bar"), i = el("i"); i.style.width = Math.max(w, 1) + "%"; bar.append(i);
      bar.title = `${k} ${won(o.val)}원`;
      const nm = el("div", "nm"); nm.append(k, el("span", "sm", won(o.val) + "원"));
      row.append(nm, bar, el("div", "pc", w.toFixed(1) + "%")); c.append(row);
    }
    p.append(c);
  }

  if (DATA.market && DATA.market.length) {
    const c = el("div", "card"); c.append(el("h2", "", "시장"));
    const g = el("div", "mk");
    for (const m of DATA.market) {
      const d = el("div"); d.append(el("div", "l", m.label), el("div", "v", m.value));
      d.append(el("div", "c " + cls(m.dir), (arrow(m.dir) + " " + (m.chg || "")).trim() || "–")); g.append(d);
    }
    c.append(g); p.append(c);
  }

  const soon = (DATA.cal || []).filter(e => { const n = ddayOf(e.date); return n >= 0 && n <= 3; }).slice(0, 5);
  if (soon.length) { const c = el("div", "card"); c.append(el("h2", "", "다가오는 일정")); soon.forEach(e => c.append(evRow(e))); p.append(c); }
}

function histChart(hist, mode) {
  const W = Math.max(260, Math.min(730, ($(".wrap").clientWidth || 360) - 30)), H = 190, L = 4, R = 4, T = 14, B = 22;
  const pts = hist.map(h => ({d: h[0], v: mode === "val" ? h[1] : (h[2] ? (h[1] / h[2] - 1) * 100 : 0), raw: h}));
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  if (mode === "ret") { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  if (hi === lo) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const x = i => L + (W - L - R) * (pts.length === 1 ? .5 : i / (pts.length - 1));
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const box = el("div", "chart");
  const svg = SVG("svg", {viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": mode === "val" ? "평가액 추이" : "누적 수익률 추이"});
  const ink3 = getComputedStyle(document.documentElement).getPropertyValue("--ink3").trim();
  const line = getComputedStyle(document.documentElement).getPropertyValue("--line").trim();
  const acc = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
  if (mode === "ret") svg.append(SVG("line", {x1: L, x2: W - R, y1: y(0), y2: y(0), stroke: ink3, "stroke-width": 1, "stroke-dasharray": "3 4", "vector-effect": "non-scaling-stroke"}));
  svg.append(SVG("line", {x1: L, x2: W - R, y1: H - B, y2: H - B, stroke: line, "stroke-width": 1, "vector-effect": "non-scaling-stroke"}));
  const d = pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  svg.append(SVG("path", {d: d + ` L${x(pts.length - 1)} ${H - B} L${x(0)} ${H - B} Z`, fill: acc, opacity: .08}));
  svg.append(SVG("path", {d, fill: "none", stroke: acc, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round", "vector-effect": "non-scaling-stroke"}));
  const hair = SVG("line", {y1: T, y2: H - B, stroke: ink3, "stroke-width": 1, "vector-effect": "non-scaling-stroke", visibility: "hidden"});
  svg.append(hair);
  for (const [i, anchor] of [[0, "start"], [pts.length - 1, "end"]]) {
    const tx = SVG("text", {x: x(i), y: H - 6, "font-size": 11, fill: ink3, "text-anchor": anchor}); tx.textContent = pts[i].d.slice(2).replace(/-/g, "."); svg.append(tx);
  }
  const fmt = p => mode === "val" ? won(p.v) + "원" : pct(p.v, 2);
  const tip = el("div", "tip"); box.append(svg, tip);
  const move = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * W;
    let i = Math.round((px - L) / (W - L - R) * (pts.length - 1)); i = Math.max(0, Math.min(pts.length - 1, i));
    hair.setAttribute("x1", x(i)); hair.setAttribute("x2", x(i)); hair.setAttribute("visibility", "visible");
    tip.textContent = ""; tip.append(el("b", "", fmt(pts[i])), document.createElement("br"), pts[i].d);
    tip.style.display = "block"; tip.style.left = Math.max(60, Math.min(r.width - 60, x(i) / W * r.width)) + "px";
  };
  const hide = () => { hair.setAttribute("visibility", "hidden"); tip.style.display = "none"; };
  svg.addEventListener("pointermove", move); svg.addEventListener("pointerdown", move); svg.addEventListener("pointerleave", hide);
  return box;
}

/* ---------- 종목 ---------- */
function spark(vals, dir) {
  const svg = SVG("svg", {viewBox: "0 0 78 30", "aria-hidden": "true"});
  if (!vals || vals.length < 2) return svg;
  const lo = Math.min(...vals), hi = Math.max(...vals), rg = hi - lo || 1;
  const d = vals.map((v, i) => (i ? "L" : "M") + (1 + 76 * i / (vals.length - 1)).toFixed(1) + " " + (27 - 24 * (v - lo) / rg).toFixed(1)).join(" ");
  svg.append(SVG("path", {d, fill: "none", stroke: `var(--${dir > 0 ? "up" : dir < 0 ? "down" : "ink3"})`, "stroke-width": 1.6, "stroke-linejoin": "round", "stroke-linecap": "round"}));
  return svg;
}
function renderStocks() {
  const p = $("#p-stk"); p.textContent = "";
  const groups = [...new Set(DATA.rows.map(r => r.grp))];
  for (const g of groups) {
    p.append(el("div", "sec", g));
    const c = el("div", "card");
    for (const r of DATA.rows.filter(x => x.grp === g)) {
      const row = el("div", "stock"), left = el("div");
      const nm = el("div", "n", r.name); if (!r.code) nm.append(el("span", "chipx", "비상장")); left.append(nm);
      let meta = [];
      if (r.val != null) meta.push([r.code, r.sector !== "미분류" ? r.sector : ""].filter(Boolean).join(" · "));
      else if (r.code) meta.push([r.code, r.sector && r.sector !== "미분류" ? r.sector : ""].filter(Boolean).join(" · "));
      else meta.push("공시·뉴스만 추적");
      left.append(el("div", "m", meta.join(" · ")));
      const right = el("div", "r");
      if (r.px != null) {
        const trend = r.spark && r.spark.length > 1 ? r.spark[r.spark.length - 1] - r.spark[0] : r.day;
        right.append(el("div", "p", r.us ? "$" + r.px.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2}) : won(r.px)));
        right.append(el("div", "c " + cls(r.day), `${arrow(r.day)} ${pct(r.day)}`));
        if (r.ret != null) right.append(el("div", "c " + cls(r.ret), `수익률 ${pct(r.ret)}`));
        row.append(left, spark(r.spark, trend), right);
      } else { right.append(el("div", "c flat", r.code ? "시세 없음" : "–")); row.append(left, el("div"), right); }
      c.append(row);
      if (r.val != null) {
        const money = (n, us) => us ? "$" + n.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2}) : won(n) + "원";
        const sg = (n, us) => (n > 0 ? "+" : n < 0 ? "−" : "") + money(Math.abs(n), us);
        const dl = el("dl", "det");
        const cell = (k, v, c2, sub) => { const d = el("div"); d.append(el("dt", "", k)); const dd = el("dd", c2 || "", v); d.append(dd); if (sub) d.append(el("small", "", sub)); dl.append(d); };
        cell("평단가", money(r.cost, r.us));
        cell("현재가", money(r.px, r.us));
        cell("주식수", r.qty.toLocaleString("ko-KR") + "주");
        cell("투자금액", money(r.inv_n, r.us), "", r.us ? "≈ " + won(r.inv) + "원" : "");
        cell("평가금액", money(r.val_n, r.us), "", r.us ? "≈ " + won(r.val) + "원" : "");
        cell("손익", `${sg(r.pnl_n, r.us)}`, cls(r.pnl_n), `${pct(r.ret)}` + (r.us ? " · ≈ " + sgn(r.pnl) + "원" : ""));
        c.append(dl);
      }
    }
    p.append(c);
  }
}

/* ---------- 일정 ---------- */
const WD = "일월화수목금토";
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const ddayOf = ds => Math.round((new Date(ds + "T00:00:00") - today0()) / 86400000);
const ddText = n => n === 0 ? "오늘" : n > 0 ? "D-" + n : "D+" + (-n);
let CALV = null, CSEL = null;
function evRow(e) {
  const row = el("div", "ev"), d = new Date(e.date + "T00:00:00"), n = ddayOf(e.date);
  const box = el("div", "d" + (n >= 0 && n <= 3 ? " soon" : ""));
  box.append(el("b", "", ddText(n)), `${d.getMonth() + 1}/${d.getDate()} ${WD[d.getDay()]}`);
  const t = el("div", "t"); t.append(el("b", "", e.name || "일정"), el("span", "", e.what)); row.append(box, t); return row;
}
function renderCal() {
  const p = $("#p-cal"); p.textContent = "";
  const now = today0(), evs = DATA.cal || [];
  if (!CALV) CALV = {y: now.getFullYear(), m: now.getMonth()};
  if (!CSEL) CSEL = iso(now);
  const by = new Map();
  for (const e of evs) { if (!by.has(e.date)) by.set(e.date, []); by.get(e.date).push(e); }

  const c = el("div", "card cal");
  const head = el("div", "calh");
  const prev = el("button", "ib", "‹"), next = el("button", "ib", "›"), td = el("button", "ib", "오늘");
  prev.type = next.type = td.type = "button"; prev.setAttribute("aria-label", "이전 달"); next.setAttribute("aria-label", "다음 달");
  prev.addEventListener("click", () => { CALV.m--; if (CALV.m < 0) { CALV.m = 11; CALV.y--; } renderCal(); });
  next.addEventListener("click", () => { CALV.m++; if (CALV.m > 11) { CALV.m = 0; CALV.y++; } renderCal(); });
  td.addEventListener("click", () => { CALV = {y: now.getFullYear(), m: now.getMonth()}; CSEL = iso(now); renderCal(); });
  head.append(el("div", "calt", `${CALV.y}년 ${CALV.m + 1}월`), td, prev, next); c.append(head);

  const grid = el("div", "calg");
  for (let i = 0; i < 7; i++) grid.append(el("div", "wd" + (i === 0 ? " sun" : i === 6 ? " sat" : ""), WD[i]));
  const first = new Date(CALV.y, CALV.m, 1), start = new Date(first); start.setDate(1 - first.getDay());
  const last = new Date(CALV.y, CALV.m + 1, 0), weeks = Math.ceil((first.getDay() + last.getDate()) / 7);
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const ds = iso(d), list = by.get(ds) || [], n = ddayOf(ds);
    const cell = el("button", "day" + (d.getMonth() !== CALV.m ? " out" : "") + (ds === iso(now) ? " today" : "") + (ds === CSEL ? " sel" : "")
      + (d.getDay() === 0 ? " sun" : d.getDay() === 6 ? " sat" : ""));
    cell.type = "button";
    cell.setAttribute("aria-label", `${d.getMonth() + 1}월 ${d.getDate()}일` + (list.length ? `, 일정 ${list.length}건` : ""));
    cell.append(el("span", "num", String(d.getDate())));
    list.slice(0, 2).forEach(e => cell.append(el("span", "chip" + (n >= 0 && n <= 3 ? " soon" : ""), e.name || e.what)));
    if (list.length > 2) cell.append(el("span", "more", "+" + (list.length - 2)));
    cell.addEventListener("click", () => { CSEL = ds; if (d.getMonth() !== CALV.m) CALV = {y: d.getFullYear(), m: d.getMonth()}; renderCal(); });
    grid.append(cell);
  }
  c.append(grid); p.append(c);

  const sd = new Date(CSEL + "T00:00:00"), sl = by.get(CSEL) || [];
  const c2 = el("div", "card");
  c2.append(el("h2", "", `${sd.getMonth() + 1}월 ${sd.getDate()}일 (${WD[sd.getDay()]}) · ${ddText(ddayOf(CSEL))}`));
  if (!sl.length) c2.append(el("div", "empty", "이 날은 일정이 없습니다."));
  else sl.forEach(e => c2.append(evRow(e)));
  p.append(c2);

  const up = evs.filter(e => ddayOf(e.date) >= 0);
  const c3 = el("div", "card"); c3.append(el("h2", "", "다가오는 일정"));
  if (!up.length) c3.append(el("div", "empty", "예정된 일정이 없습니다. 일정은 매일 아침 갱신됩니다."));
  else up.slice(0, 30).forEach(e => c3.append(evRow(e)));
  p.append(c3);
}

/* ---------- 소식 ---------- */
let FSEL = null;                                   // 선택한 회사 (null = 로고 목록)
const FLAB = { f: "공시", n: "뉴스", r: "리서치" };
function logoUrls(name) {
  const r = (DATA.rows || []).find(x => x.name === name);
  const local = "logos/" + encodeURIComponent(name) + ".png";      // dash/logos/회사명.png 를 넣으면 그 그림을 씁니다
  if (!r || !r.code) return [local];
  if (r.us) return ["https://financialmodelingprep.com/image-stock/" + encodeURIComponent(r.code.replace(".", "-")) + ".png",
                    "https://assets.parqet.com/logos/symbol/" + encodeURIComponent(r.code) + "?format=png", local];
  return ["https://static.toss.im/png-icons/securities/icn-sec-fill-" + encodeURIComponent(r.code) + ".png",
          "https://ssl.pstatic.net/imgstock/fn/real/logo/stock/Stock" + encodeURIComponent(r.code) + ".svg", local];
}
function logoEl(name) {
  const box = el("div", "logo"), urls = logoUrls(name), img = new Image();
  const fallback = () => { box.textContent = ""; box.classList.add("tx"); box.textContent = name.replace(/[\s()㈜]/g, "").slice(0, 2); };
  let k = 0;
  img.alt = ""; img.loading = "lazy"; img.referrerPolicy = "no-referrer";
  img.addEventListener("error", () => { k += 1; if (k < urls.length) img.src = urls[k]; else fallback(); });
  img.src = urls[0]; box.append(img);
  return box;
}
function feedItem(it, showName) {
  const a = el("a"); a.target = "_blank"; a.rel = "noopener noreferrer";
  if (FMODE === "f") {
    a.href = "https://dart.fss.or.kr/dsaf001/main.do?rcpNo=" + encodeURIComponent(it.no);
    const h = el("div", "h", [showName ? it.name : "", `${it.date.slice(4, 6)}/${it.date.slice(6, 8)}`].filter(Boolean).join(" · "));
    if (it.imp) h.append(" · ", el("span", "imp", "주요")); a.append(h, el("div", "ti", it.title));
  } else {
    if (/^https?:\/\//.test(it.link || "")) a.href = it.link;
    a.append(el("div", "h", [showName ? it.name : "", it.src, it.at].filter(Boolean).join(" · ")), el("div", "ti", it.title));
  }
  return a;
}
function renderFeed() {
  const p = $("#p-feed"); p.textContent = "";
  const seg = el("div", "seg");
  for (const [k, lab] of [["f", "공시"], ["n", "뉴스"], ["r", "리서치"]]) {
    const b = el("button", FMODE === k ? "on" : "", lab); b.type = "button";
    b.addEventListener("click", () => { FMODE = k; FSEL = null; renderFeed(); }); seg.append(b);
  }
  p.append(seg);
  const items = (FMODE === "f" ? DATA.filings : FMODE === "n" ? DATA.news : DATA.research) || [];
  const groups = new Map();                          // 회사별 묶음 (최근 소식이 있는 회사부터)
  for (const it of items) { if (!groups.has(it.name)) groups.set(it.name, []); groups.get(it.name).push(it); }
  if (FSEL && FSEL !== "*" && !groups.has(FSEL)) FSEL = null;

  if (FSEL) {                                        // 회사 하나를 골랐을 때: 그 회사 소식만
    const list = FSEL === "*" ? items : groups.get(FSEL);
    const c = el("div", "card feed"), h = el("div", "fh");
    const t = el("div", "t"); t.append(el("b", "", FSEL === "*" ? "전체" : FSEL), el("span", "", `${FLAB[FMODE]} ${list.length}건`));
    const back = el("button", "ib", "← 회사 목록"); back.type = "button"; back.addEventListener("click", () => { FSEL = null; renderFeed(); window.scrollTo(0, 0); });
    if (FSEL === "*") { const lg = el("div", "logo tx", "ALL"); h.append(lg); } else h.append(logoEl(FSEL));
    h.append(t, back); c.append(h);
    for (const it of list) c.append(feedItem(it, FSEL === "*"));
    p.append(c);
    return;
  }

  const c = el("div", "card");
  if (FMODE === "r") c.append(el("div", "empty", "보유·관심 종목이 언급된 투자자 서한과 분기 서한 소식입니다. 회사를 누르면 목록이 열립니다."));
  if (!items.length) { c.append(el("div", "empty", "아직 수집된 항목이 없습니다.")); p.append(c); return; }
  const grid = el("div", "lg");
  const tile = (key, name, n, logo, sub, imp) => {
    const b = el("button", "lt"); b.type = "button"; b.setAttribute("aria-label", `${name} ${FLAB[FMODE]} ${n}건`);
    const bx = el("div", "bx"); bx.append(logo, el("span", "ct" + (imp ? " imp" : ""), String(n)));
    b.append(bx, el("span", "nm", name)); if (sub) b.append(el("span", "sb", sub));
    b.addEventListener("click", () => { FSEL = key; renderFeed(); window.scrollTo(0, 0); });
    grid.append(b);
  };
  tile("*", "전체", items.length, el("div", "logo tx", "ALL"), "", false);
  for (const [name, list] of groups) {
    const d = FMODE === "f" ? `${list[0].date.slice(4, 6)}/${list[0].date.slice(6, 8)}` : (list[0].at || "").slice(0, 5);
    tile(name, name, list.length, logoEl(name), d, FMODE === "f" && list.some(x => x.imp));
  }
  c.append(grid);
  p.append(c);
}

let RZ; window.addEventListener("resize", () => { clearTimeout(RZ); RZ = setTimeout(() => { if (DATA) renderSum(); }, 150); });
(async () => { const s = store.get("pf_pw"); if (s) await load(s); })();
</script>
